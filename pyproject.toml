[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "explodeforecast"
version = "0.1.0"
description = "Count declared dependent JSON array expansions before building product rows"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.scripts]
explodeforecast = "explodeforecast.__main__:entrypoint"

[tool.setuptools.packages.find]
include = ["explodeforecast*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
